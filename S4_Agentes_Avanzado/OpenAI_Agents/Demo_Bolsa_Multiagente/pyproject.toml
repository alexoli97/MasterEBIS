[project]
name = "bolsa"
version = "0.1.0"
description = "Multi-agent stock investment system with OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.0.10",
    "streamlit>=1.40.0",
    "yfinance>=0.2.50",
    "pyportfolioopt>=1.5.5",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "fabric>=3.2.2",
    "plotly>=5.24.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
