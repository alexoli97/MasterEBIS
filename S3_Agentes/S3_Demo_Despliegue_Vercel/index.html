<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pregunta a la IA · EBIS</title>
<style>
  :root { --azul: #0b3c5d; --turquesa: #2a9db5; --fondo: #f3f7fa; --gris: #44525e; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--gris); }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { color: var(--azul); font-size: 28px; margin: 0 0 8px; }
  p.sub { margin: 0 0 24px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 12px 14px; font-size: 16px; border: 1px solid #c9d6df; border-radius: 10px; }
  button { padding: 12px 18px; font-size: 16px; border: 0; border-radius: 10px; background: var(--turquesa); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #respuesta { margin-top: 24px; padding: 16px; background: #fff; border-radius: 12px; min-height: 56px; white-space: pre-wrap; line-height: 1.5; }
  .nota { margin-top: 32px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Pregunta a la IA</h1>
  <p class="sub">Esta página es pública. La clave de OpenAI no está aquí: la usa una función en el servidor.</p>
  <form id="f">
    <input id="pregunta" maxlength="300" placeholder="¿Qué es un token?" required>
    <button id="boton">Preguntar</button>
  </form>
  <div id="respuesta"></div>
  <p class="nota">Demo de la sesión 3 · EBIS Business Techschool</p>
</main>
<script>
  const f = document.getElementById("f"), boton = document.getElementById("boton"), salida = document.getElementById("respuesta");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    boton.disabled = true;
    salida.textContent = "Pensando…";
    try {
      // el navegador habla con NUESTRO servidor (/api/pregunta), nunca directamente con OpenAI
      const r = await fetch("/api/pregunta", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pregunta: document.getElementById("pregunta").value }),
      });
      const datos = await r.json();
      salida.textContent = datos.respuesta || datos.error || "Sin respuesta.";
    } catch (err) {
      salida.textContent = "No se pudo conectar con el servidor.";
    } finally {
      boton.disabled = false;
    }
  });
</script>
</body>
</html>
